<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>История</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-white shadow-sm border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold text-dark" href="/">Шаблоны протоколов</a>
            <div class="d-flex gap-3">
                <a href="/" class="btn btn-outline-secondary">← К шаблонам</a>
                <a href="/constructor" class="btn btn-success">Создать новый шаблон</a>
            </div>
        </div>
    </nav>
    <div class="container mt-5">
        <h1 class="mb-4">Сохранённые протоколы</h1>
        {% if files %}
        <div class="card shadow-sm">
            <ul class="list-group list-group-flush">
                {% for file in files %}
                <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                    <span>{{ file }}</span>
                    <div>
                        <a href="/saved/{{ file }}" class="btn btn-sm btn-outline-secondary me-2" download>Скачать</a>
                        <form method="POST" action="/delete_saved/{{ file }}" class="inline-form" onsubmit="return confirm('Удалить протокол «{{ file }}»?')">
                            <button type="submit" class="btn btn-sm btn-danger">Удалить</button>
                        </form>
                    </div>
                </li>
                {% endfor %}
            </ul>
        </div>
        {% else %}
        <div class="alert alert-info">Пока нет сохранённых протоколов.</div>
        {% endif %}
    </div>
</body>
</html>
