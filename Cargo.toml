[package]
name = "doc_template_app"
version = "0.1.0"
edition = "2021"

# cargo +nightly xwin build --target i686-win7-windows-msvc -Z build-std=core,std,alloc,panic_abort --release

# [profile.dev]
# panic = "abort"

[profile.release]
# lto = true
# opt-level = "s"
panic = "abort"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
actix-web = { version = "4"}
actix-multipart = { version = "0.4", default-features = false }
actix-files = "0.6.9"
futures = { version = "0.3", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tera = { version = "1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = { version = "1", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zip = { version = "7.2.0", default-features = false, features = ["deflate", "time"] }
quick-xml = "0.31"
webbrowser = "0.8"
roxmltree = "0.20"
# clap = "3"
# walkdir = "2"
# prettytable = "0.10.0"
# sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls"]}
actix-web-httpauth = "0.8"
env_logger = "0.11"